<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GO! | Documento</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&amp;family=Hanken+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF0F3;font-family:'Hanken Grotesk',system-ui,sans-serif;color:#0F1114}
.g{fill:var(--g);fill-rule:evenodd}
.b{fill:var(--b)}
.t{fill:var(--t)}
.p{display:flex;align-items:center;justify-content:center;gap:24px;border-radius:12px;color:var(--tx);font-family:'Hanken Grotesk',sans-serif;font-size:12px;line-height:12px;font-weight:500}
.L{background:#FFFFFF;--g:#0F1114;--b:#0A9E64;--tx:#5B6270}
.D{background:#0F1114;--g:#F4F5F7;--b:#0A9E64;--tx:#9AA1AC}
.L.I{--t:#0F1114;--g:#FFFFFF;--b:#0A9E64}
.D.I{--t:#F4F5F7;--g:#0F1114;--b:#0A9E64}
.ML{background:#FFFFFF;--g:#0F1114;--b:#0F1114;--t:#0F1114;--tx:#5B6270}
.MD{background:#0F1114;--g:#FFFFFF;--b:#FFFFFF;--t:#FFFFFF;--tx:#9AA1AC}
.ML.MLI{--g:#FFFFFF;--b:#FFFFFF}
.MD.MDI{--g:#0F1114;--b:#0F1114}
.lb{font-family:'Hanken Grotesk',sans-serif;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B6270}
.card{background:#fff;border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:14px}
.h2{font-size:22px;line-height:28px;font-weight:700}
.tx{font-size:15px;line-height:22px;color:#3A404A}
.sm{font-size:13px;line-height:18px;color:#5B6270}
</style>
</head>
<body>
<div style="max-width:794px;margin:0 auto;padding:40px 24px;box-sizing:border-box">
<div style="display:flex"><div style="flex:1.3;background:#fff;border-radius:12px;padding:36px;display:flex;flex-direction:column;gap:22px;min-height:520px"><div style="display:flex;justify-content:space-between;align-items:flex-start;padding-bottom:18px;border-bottom:2px solid #0F1114"><div style="--g:#0F1114;--b:#0A9E64"><span style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:48.6px;letter-spacing:-.05em;line-height:1;color:var(--g);white-space:nowrap;display:inline-block">GO<span style="color:var(--b)">!</span></span></div><div style="text-align:right;font-size:13px;line-height:18px;color:#3A404A"><b style="font-size:16px;color:#0F1114">Ordem de serviço</b><br>Nº [000000]<br>[data]</div></div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 24px;font-size:13px;line-height:18px;color:#3A404A"><div><b>Cliente</b><br>[nome do cliente]</div><div><b>Técnico</b><br>[nome do técnico]</div><div><b>Equipamento</b><br>[equipamento]</div><div><b>Situação</b><br>[situação]</div></div><div style="flex:1;border:1.5px dashed #C9CED6;border-radius:8px;padding:16px;font-size:13px;color:#5B6270">[descrição do serviço]</div><div style="display:flex;justify-content:space-between;align-items:center;padding-top:14px;border-top:1px solid #DDE0E5;font-size:12px;color:#5B6270"><span>[empresa] · [contato]</span><div style="display:flex;align-items:center;gap:6px"><span>um produto</span><span style="--g:#0F1114;--b:#0A9E64"><span style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:17.1px;letter-spacing:-.05em;line-height:1;color:var(--g);white-space:nowrap;display:inline-block">GO<span style="color:var(--b)">!</span></span></span></div></div></div></div>
</div>
</body>
</html>
