<!doctype html>
<html lang="pt-BR">
<head>

<title>GO! | Tela de login</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@800&amp;family=Hanken+Grotesk:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#EEF0F3;font-family:'Hanken Grotesk',system-ui,sans-serif;color:#0F1114}
.g{fill:var(--g);fill-rule:evenodd}
.b{fill:var(--b)}
.t{fill:var(--t)}
.p{display:flex;align-items:center;justify-content:center;gap:24px;border-radius:12px;color:var(--tx);font-family:'Hanken Grotesk',sans-serif;font-size:12px;line-height:12px;font-weight:500}
.L{background:#FFFFFF;--g:#0F1114;--b:#0A9E64;--tx:#5B6270}
.D{background:#0F1114;--g:#F4F5F7;--b:#0A9E64;--tx:#9AA1AC}
.L.I{--t:#0F1114;--g:#FFFFFF;--b:#0A9E64}
.D.I{--t:#F4F5F7;--g:#0F1114;--b:#0A9E64}
.ML{background:#FFFFFF;--g:#0F1114;--b:#0F1114;--t:#0F1114;--tx:#5B6270}
.MD{background:#0F1114;--g:#FFFFFF;--b:#FFFFFF;--t:#FFFFFF;--tx:#9AA1AC}
.ML.MLI{--g:#FFFFFF;--b:#FFFFFF}
.MD.MDI{--g:#0F1114;--b:#0F1114}
.lb{font-family:'Hanken Grotesk',sans-serif;font-size:13px;line-height:16px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#5B6270}
.card{background:#fff;border-radius:12px;padding:28px;display:flex;flex-direction:column;gap:14px}
.h2{font-size:22px;line-height:28px;font-weight:700}
.tx{font-size:15px;line-height:22px;color:#3A404A}
.sm{font-size:13px;line-height:18px;color:#5B6270}
</style>
</head>
<body>
<div style="max-width:560px;margin:0 auto;padding:40px 24px;box-sizing:border-box">
<div style="display:flex"><div style="flex:1.1;background:#fff;border-radius:12px;padding:44px;display:flex;flex-direction:column;justify-content:space-between;min-height:520px"><div style="display:flex;flex-direction:column;gap:22px"><div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:30px;line-height:36px;font-weight:700">Entrar no SGO</div><div class="sm">Sistema de Gestão Operacional</div></div><div style="display:flex;flex-direction:column;gap:6px"><label style="font-size:13px;font-weight:700;color:#3A404A" for="E-mail">E-mail</label><input id="E-mail" type="email" placeholder="nome@empresa.com.br" style="height:44px;box-sizing:border-box;border:1.5px solid #C9CED6;border-radius:8px;padding:0 14px;font-family:inherit;font-size:15px;background:#fff"></div><div style="display:flex;flex-direction:column;gap:6px"><label style="font-size:13px;font-weight:700;color:#3A404A" for="Senha">Senha</label><input id="Senha" type="password" placeholder="" style="height:44px;box-sizing:border-box;border:1.5px solid #C9CED6;border-radius:8px;padding:0 14px;font-family:inherit;font-size:15px;background:#fff"></div><button style="height:48px;border:0;border-radius:8px;background:#0F1114;color:#fff;font-family:inherit;font-size:16px;font-weight:700">Entrar</button></div><div class="p L" style="justify-content:flex-start;gap:6px;color:#5B6270"><span>um produto</span><span style="font-family:'Unbounded',sans-serif;font-weight:800;font-size:17.1px;letter-spacing:-.05em;line-height:1;color:var(--g);white-space:nowrap;display:inline-block">GO<span style="color:var(--b)">!</span></span></div></div></div>
</div>

</html>
